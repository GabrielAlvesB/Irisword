name: CI

# Builds IrisWord and runs the core tests on every push to main and every pull request.
# Self-contained: no reusable workflows from other organisations, no secrets, read-only token.
# Third-party actions are pinned by commit SHA.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev

      # Translations, spelling and hyphenation data, at the commit pinned in craft-i18n.rev.
      - name: craft-i18n
        shell: bash
        run: |
          git init -q "$RUNNER_TEMP/craft-i18n"
          git -C "$RUNNER_TEMP/craft-i18n" fetch -q --depth 1 https://github.com/storytold/craft-i18n "$(cat craft-i18n.rev)"
          git -C "$RUNNER_TEMP/craft-i18n" checkout -q FETCH_HEAD
          echo "CRAFT_I18N_DIR=$RUNNER_TEMP/craft-i18n" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check the whole workspace
        run: cargo check --workspace --all-targets

      - name: Core tests (document model, .docx, formats, engine, interface)
        run: cargo test --no-fail-fast -p wordcraft-doc -p wordcraft-docx -p wordcraft-formats -p wordcraft-engine -p wordcraft-control-key -p wordcraft-ui-egui -p xtask

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    IrisWord app icon: a page with a folded corner and a "W", the same drawing the Iris
    Workspace shows (Iris/src/shared/types/workspace.types.ts, hue 285). The gradient is its
    oklch(0.66 0.2 285) → oklch(0.6 0.21 327) in sRGB, so every renderer draws the same colours.
    Every PNG, .ico and .icns in this folder is rendered from this file.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a79ff"/>
      <stop offset="1" stop-color="#bd44c0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#g)"/>
  <path d="M21 14h15l9 9v25a3 3 0 0 1-3 3H21a3 3 0 0 1-3-3V17a3 3 0 0 1 3-3z" fill="#fff" fill-opacity=".95"/>
  <path d="M36 14v7a2 2 0 0 0 2 2h7" fill="#fff" fill-opacity=".55"/>
  <path d="m23.5 29 3.2 12 4.3-9.5 4.3 9.5 3.2-12" fill="none" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
